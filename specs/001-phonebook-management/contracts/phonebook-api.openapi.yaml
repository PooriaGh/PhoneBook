# NOTE (feature 002): GET /api/v1/contacts?tag= is superseded by
# specs/002-production-readiness/contracts/phonebook-api-changes.openapi.yaml. It now returns a paged object
# { items, page, pageSize, totalCount, hasNext } instead of an array (BREAKING, FR-006). Every business route may
# also answer 429 (RateLimit.Exceeded). Specs are the source of truth (constitution VII).
openapi: 3.0.4
info:
  title: PhoneBook API
  version: "1.0"
  description: >
    Phone book resource API (spec 001-phonebook-management).
    All endpoints require an OAuth2 access token issued by PhoneBook.Identity
    (client-credentials). Errors follow RFC 9457 Problem Details.
servers:
  - url: https://localhost:7001
security:
  - oauth2: []
paths:
  /api/v1/contacts:
    post:
      operationId: CreateContact
      summary: Add a contact to the phone book (US1, FR-001..FR-005, FR-018)
      tags: [Contacts]
      security: [{ oauth2: [phonebook.write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequest" }
            example: { firstName: "علی", lastName: "رضایی", phoneNumber: "+98 912 123 4567", tag: "شماره همکارم در ترابرنت" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string }, description: /api/v1/contacts/{id} }
            ETag: { schema: { type: string }, description: 'Quoted version, e.g. "1"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      operationId: GetContactsByTag
      summary: Get all contacts carrying a tag (US2, FR-008, FR-009) — served by Dapper
      tags: [Contacts]
      security: [{ oauth2: [phonebook.read] }]
      parameters:
        - name: tag
          in: query
          required: true
          description: Exact tag; case-insensitive; surrounding whitespace ignored.
          schema: { type: string, maxLength: 50 }
      responses:
        "200":
          description: Matching contacts (empty array when none), ordered by last name then first name using ordinal (character-code) comparison.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactResponse" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/contacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Non-GUID values → 400 Contact.Id.Invalid for authenticated callers; anonymous callers get 401 (constitution VI).
    get:
      operationId: GetContactById
      summary: Get one contact (supporting endpoint for Location header) — served by ReadDbContext
      tags: [Contacts]
      security: [{ oauth2: [phonebook.read] }]
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: UpdateContact
      summary: Replace a contact's editable fields (US3, FR-006, FR-007)
      tags: [Contacts]
      security: [{ oauth2: [phonebook.write] }]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequest" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
    delete:
      operationId: DeleteContact
      summary: Delete a contact (US4, FR-010, FR-011)
      tags: [Contacts]
      security: [{ oauth2: [phonebook.write] }]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
  /health/live:
    get: { operationId: Live, security: [], tags: [Health], responses: { "200": { description: Process alive } } }
  /health/ready:
    get: { operationId: Ready, security: [], tags: [Health], responses: { "200": { description: DB reachable }, "503": { description: Unhealthy } } }

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:7002/connect/token   # rendered from Auth:PublicAuthority
          scopes:
            phonebook.read: Read contacts
            phonebook.write: Create, update and delete contacts
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional quoted version (from ETag). Mismatch → 412.
      schema: { type: string, example: '"3"' }
  schemas:
    ContactRequest:
      type: object
      required: [firstName, lastName, phoneNumber, tag]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phoneNumber:
          type: string
          description: Optional leading '+', digits (ASCII/Persian/Arabic-Indic), spaces or '-' separators; 4–15 digits.
          example: "+98 912-123-4567"
        tag: { type: string, maxLength: 50 }
    ContactResponse:
      type: object
      required: [id, firstName, lastName, phoneNumber, tag, version]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string, description: Normalized, e.g. "+989121234567" }
        tag: { type: string, description: Display value as entered (trimmed) }
        version: { type: integer, minimum: 1 }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errorCode: { type: string, description: e.g. Contact.NotFound }
    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties: { type: array, items: { type: string } }
              example: { phoneNumber: ["PhoneNumber.InvalidCharacters: Phone number may contain only digits, spaces, '-' and a leading '+'."] }
  responses:
    ValidationProblem:
      description: Invalid input (400)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ValidationProblemDetails" } } }
    Unauthorized:
      description: Missing/invalid token (401), errorCode Auth.Unauthorized
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    Forbidden:
      description: Token lacks required scope (403), errorCode Auth.Forbidden
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    NotFound:
      description: Contact not found (404)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    Conflict:
      description: Duplicate (phone + tag) or concurrent modification (409)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    PreconditionFailed:
      description: If-Match does not match current version (412)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    ServerError:
      description: Unexpected error, no internals leaked (500)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
