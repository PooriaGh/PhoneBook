# PhoneBook: API + separate OpenIddict identity server.
#   docker compose up --build                      -> API on in-memory SQLite (default)
#   docker compose --profile postgres up --build   -> additionally an API instance on PostgreSQL (port 7003)
#   docker compose --profile observability up --build -> additionally the Aspire dashboard (http://localhost:18888)
#       showing traces and metrics from both hosts (feature 002). Without the profile, export fails quietly.
#
# Swagger UI: http://localhost:7001/swagger  (Authorize with client "phonebook-swagger").
# The browser fetches tokens from localhost:7002, but the issuer is fixed to http://identity:8080/, which the
# API container can reach for discovery and JWKS (research R-12, finding U5).

services:
  identity:
    build:
      context: .
      dockerfile: src/PhoneBook.Identity/Dockerfile
    ports:
      - "7002:8080"
    environment:
      # Development enables the DEV-ONLY clients from appsettings.Development.json and plain-HTTP tokens.
      ASPNETCORE_ENVIRONMENT: Development
      Identity__Issuer: http://identity:8080/
      Identity__AllowedCorsOrigins__0: http://localhost:7001
      Identity__AllowedCorsOrigins__1: http://localhost:7003
      Telemetry__OtlpEndpoint: http://aspire-dashboard:18889

  api:
    build:
      context: .
      dockerfile: src/PhoneBook.Api/Dockerfile
    ports:
      - "7001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__Authority: http://identity:8080/
      Auth__PublicAuthority: http://localhost:7002
      Telemetry__OtlpEndpoint: http://aspire-dashboard:18889
    depends_on:
      - identity

  # DEV-ONLY credentials. Never use them outside local development.
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: phonebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Deployment requirement: byte-order collation for paging (feature 002, research R-02).
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phonebook"]
      interval: 2s
      timeout: 5s
      retries: 20

  api-postgres:
    build:
      context: .
      dockerfile: src/PhoneBook.Api/Dockerfile
    profiles: [postgres]
    ports:
      - "7003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__Authority: http://identity:8080/
      Auth__PublicAuthority: http://localhost:7002
      Database__Provider: Postgres
      # DEV-ONLY credentials.
      Database__ConnectionString: Host=postgres;Database=phonebook;Username=postgres;Password=postgres
      Telemetry__OtlpEndpoint: http://aspire-dashboard:18889
    depends_on:
      identity:
        condition: service_started
      postgres:
        condition: service_healthy

  # Local OTLP receiver with a trace and metric UI (feature 002, research R-04). MIT-licensed.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5
    profiles: [observability]
    ports:
      - "18888:18888"
    environment:
      # DEV-ONLY: no dashboard authentication.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
